<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Users</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <a href="/dashboard">Dashboard</a> &nbsp;&nbsp;
    <a href="/all-user">All users</a> &nbsp;&nbsp;
    <a href="/add-user">Add User</a> &nbsp;&nbsp;
    <br>
    <h1>Add Users</h1>
    <form action="/api/add-user" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="age">Age:</label>
        <input type="age" id="age" name="age"><br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br><br>
        <input type="submit" value="Add User">
    </form>
    <script>
        fetch('/api/all-user').then(response => response.json()).then(data => {
            let setResponse = '';
            data.forEach(user => {
                let isDeleted = user.isDeleted ? 'Restore' : 'Delete';
                setResponse += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.username}</td>
                        <td>${user.age}</td>
                        <td>
                            <a href="/find-user/${user.id}">Edit</a>
                            &nbsp;&nbsp;
                            &nbsp;&nbsp;
                            <a href="/delete-user/${user.id}">${isDeleted}</a></td>
                    </tr>
                `;
            });
            document.getElementById('setResponse').innerHTML = setResponse;
        });
    </script>    
</body>
</html>
